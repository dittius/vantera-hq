[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vantera"
version = "0.1.0"
description = "Autonomous, zero-capital, AI-native holding company operating system"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]

[project.scripts]
vantera = "vantera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vantera = ["static/*"]
