name: VANTERA Autonomous Operations

on:
  schedule:
    # Execute existing venture work hourly; deep discovery remains intentionally bounded.
    - cron: "17 * * * *"
    - cron: "41 */6 * * *"
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      ceo_message:
        description: "Owner message delivered to the real CEO model agent"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vantera-production
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONPATH: src
      VANTERA_DB: production/vantera.db
      VANTERA_RUN_KEY: github-${{ github.run_id }}
      VANTERA_CYCLE_INTERVAL: "21600"
      VANTERA_TASK_LIMIT: "20"
      VANTERA_MAX_UNITS: "25"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      VANTERA_MODEL_DAILY_LIMIT: "40"
      VANTERA_MODEL_CYCLE_LIMIT: "10"
      VANTERA_MODEL_AGENT_DAILY_LIMIT: "6"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore and migrate persistent state
        run: python -m vantera init
      - name: Run scheduled autonomous workload
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m vantera remote-cycle --force
          elif [ "${{ github.event.schedule }}" = "17 * * * *" ]; then
            python -m vantera.remote_jobs execution --run-key "$VANTERA_RUN_KEY-execution"
          elif [ "${{ github.event.schedule }}" = "7 5 * * *" ]; then
            python -m vantera.remote_jobs reporting --run-key "$VANTERA_RUN_KEY-reporting"
          else
            # Cron itself bounds deep discovery to four runs/day. Force avoids time drift
            # when GitHub starts a scheduled runner a few minutes late.
            python -m vantera remote-cycle --force
          fi
      - name: Resume real model work deferred by free-tier quota
        run: python -m vantera agent-queue
      - name: Automatically verify provider and real executive team after authentication
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 */6 * * *'
        run: |
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
            python -m vantera agent-bootstrap
          else
            echo "Real-agent authentication is pending; deterministic fallback remains disabled."
          fi
      - name: Deliver Owner message to real CEO agent
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.ceo_message != ''
        env:
          OWNER_MESSAGE: ${{ github.event.inputs.ceo_message }}
        run: python -m vantera ceo-chat --message "$OWNER_MESSAGE"
      - name: Export evidence-backed HQ state
        if: always()
        run: python -m vantera export --output public/data/state.json
      - name: Persist database and public state
        if: always()
        run: |
          git config user.name "VANTERA CEO"
          git config user.email "actions@users.noreply.github.com"
          git add -f production/vantera.db
          git add -A public
          if [ -d production/ventures ]; then git add -A production/ventures; fi
          git diff --cached --quiet || git commit -m "ops: persist autonomous cycle $GITHUB_RUN_ID"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
